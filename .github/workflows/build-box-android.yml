name: build-box-android

# Drives the ANDROID Chromium build box (AWS EC2 Linux, stop-by-default) from CI with NO
# long-lived secret — GitHub OIDC → a least-privilege AWS role. The Linux/Android twin of
# build-box.yml; docs/oidc-build-lane.md § "Porting checklist — a Linux + Android twin" is
# the spec this implements, bullet for bullet.
#
# WHY A SECOND WORKFLOW AND NOT A MATRIX. It is a different instance, a different SSM
# document (AWS-RunShellScript, not AWS-RunPowerShellScript), a different IAM role with its
# own `sub`, and a different concurrency group. Sharing one workflow would let either lane's
# always()-stop step stop the OTHER lane's box mid-build — the exact failure the Windows
# lane's concurrency comment describes.
#
# CONTRACT: the box is STOPPED before and after. The stop step runs with `if: always()` so a
# failed/cancelled build can never leave the instance (and the bill) running.
#
# ── ONE-TIME SETUP, NOT DONE BY THIS FILE ─────────────────────────────────────────────
# Repo VARIABLES required (Settings → Secrets and variables → Actions → Variables):
#   AWS_ANDROID_BUILD_ROLE_ARN       printed by scripts/aws/setup-oidc.sh
#   AWS_ANDROID_BUILD_INSTANCE_ID    the Linux builder's i-… id
# Neither is hardcoded here on purpose: the instance id currently lives only in the
# gitignored .env.local (DXR_LINUX_BOX_INSTANCE_ID) and must not enter a tracked file.
# The `instance_id` input below overrides the variable for a one-off run.
#
# A GitHub ENVIRONMENT named `build-box-android` must exist — the role's trust policy pins
# sub to `repo:DisplayXR/displayxr-browser:environment:build-box-android`, so the
# `environment:` line in the job is load-bearing.
#
# IAM (run once, from a box with an AWS session — it is NOT run by CI):
#   INSTANCE_ID=<the linux box> GH_ENV=build-box-android \
#   ROLE_NAME=DisplayXRBrowserAndroidBuildBox POLICY_NAME=AndroidBuildBoxAndArtifacts \
#   SSM_DOCUMENT=AWS-RunShellScript scripts/aws/setup-oidc.sh --apply
# SSM_DOCUMENT is NOT optional: the document name is part of the granted resource ARN, and
# a mismatch fails as AccessDeniedException on SendCommand, not "no such document".

on:
  workflow_call:
    inputs:
      chromium_tag:
        description: "Chromium tag to build (blank = the pin in scripts/config.env)"
        type: string
        default: ""
      patch_ref:
        # Which commit of THIS repo supplies patches/ + scripts/. do_rebase.sh pulls the
        # series from git before applying it, so the box cannot drift from the repo.
        description: "Git ref of this repo whose patches/ to apply (blank = the caller's SHA)"
        type: string
        default: ""
      job:
        description: "Marker/job name written on the box (/opt/build/<job>.done)"
        type: string
        default: "android"
      instance_id:
        description: "Override the AWS_ANDROID_BUILD_INSTANCE_ID repo variable"
        type: string
        default: ""
      build_user:
        # The unprivileged account the build runs as. RunCommand's Linux agent is root, so
        # this is a step DOWN (easier than the Windows lane, which had to step UP through a
        # scheduled task). Set it to whatever account owns the checkout on the box.
        description: "Unprivileged user to run the build as (sudo -u)"
        type: string
        default: "builder"
      timeout_minutes:
        description: "Max minutes to wait for the remote build"
        type: number
        default: 300
    outputs:
      artifact_key:
        description: "S3 key of the produced APK"
        value: ${{ jobs.build.outputs.artifact_key }}
  workflow_dispatch:
    inputs:
      chromium_tag:
        description: "Chromium tag to build (blank = pin)"
        type: string
        default: ""
      patch_ref:
        description: "Git ref of this repo whose patches/ to apply (blank = this ref's SHA)"
        type: string
        default: ""
      instance_id:
        description: "Override the AWS_ANDROID_BUILD_INSTANCE_ID repo variable"
        type: string
        default: ""
      build_user:
        description: "Unprivileged user to run the build as (sudo -u)"
        type: string
        default: "builder"
      lifecycle_only:
        # DEFAULT TRUE, exactly as the Windows lane. This is what lets anyone smoke-test the
        # OIDC + SSM + start/stop path in ~2 minutes without spending a multi-hour build —
        # and it is the only cheap way to prove a fresh IAM role actually works.
        description: "Start + stop the box without building (smoke-test OIDC)"
        type: boolean
        default: true

# ONE build at a time, and a DIFFERENT group from `build-box` — it is a different instance,
# so the two lanes must not queue behind each other.
#
# cancel-in-progress is deliberately FALSE, for the same reason as the Windows lane: every
# run's "Stop the build box" is always(), so cancelling a run to start another would STOP
# THE BOX UNDER THE FIRST ONE'S RUNNING BUILD. The runs also share /opt/build/<job>.done
# and the single Chromium checkout, which do_rebase.sh resets.
concurrency:
  group: build-box-android
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mint the OIDC token we trade for the AWS role

env:
  AWS_REGION: us-east-1
  # NOT hardcoded — see the header. Input wins over the repo variable.
  INSTANCE_ID: ${{ inputs.instance_id || vars.AWS_ANDROID_BUILD_INSTANCE_ID }}
  ARTIFACT_BUCKET: displayxr-browser-artifacts
  BUILD_DIR: /opt/build
  BUILD_USER: ${{ inputs.build_user || 'builder' }}
  # AWS-RunShellScript, never AWS-RunPowerShellScript. Read by scripts/aws/ssm-run.sh, and
  # it must match the document ARN granted by setup-oidc.sh's RunTheBuildViaSSM Sid.
  SSM_DOCUMENT: AWS-RunShellScript
  # Exposed so ssm-run.sh can re-mint credentials mid-wait when the OIDC session ages out.
  # The variable name is ssm-run.sh's, shared by both lanes; the VALUE is the Android role.
  AWS_BUILD_ROLE_ARN: ${{ vars.AWS_ANDROID_BUILD_ROLE_ARN }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The role's trust policy pins sub to `...:environment:build-box-android`, so this line
    # is load-bearing: without it the OIDC token has a different sub and AssumeRole fails.
    environment: build-box-android
    outputs:
      artifact_key: ${{ steps.fetch.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the required repo variables are set
        # A blank INSTANCE_ID would otherwise reach `aws ec2 describe-instances` and fail
        # with a parameter-validation error that says nothing about the missing variable.
        run: |
          set -euo pipefail
          [ -n "${INSTANCE_ID:-}" ] || {
            echo "::error::INSTANCE_ID is empty. Set the repo variable"
            echo "::error::AWS_ANDROID_BUILD_INSTANCE_ID (it lives in the gitignored"
            echo "::error::.env.local as DXR_LINUX_BOX_INSTANCE_ID) or pass instance_id."
            exit 1; }
          [ -n "${AWS_BUILD_ROLE_ARN:-}" ] || {
            echo "::error::AWS_ANDROID_BUILD_ROLE_ARN is empty. Run scripts/aws/setup-oidc.sh"
            echo "::error::with ROLE_NAME=DisplayXRBrowserAndroidBuildBox GH_ENV=build-box-android"
            echo "::error::SSM_DOCUMENT=AWS-RunShellScript --apply and paste the printed ARN in."
            exit 1; }
          echo "instance=$INSTANCE_ID user=$BUILD_USER doc=$SSM_DOCUMENT"

      - name: Assume AWS role (OIDC, no stored secret)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ANDROID_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-box-android-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Start the build box
        run: |
          set -euo pipefail
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
                  --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "current state: $state"
          if [ "$state" != "running" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          echo "instance running"

      - name: Wait for SSM agent
        run: |
          set -euo pipefail
          # The agent registers a little after the instance reports running. On Ubuntu AMIs
          # amazon-ssm-agent often ships as a snap that has to be enabled — if this step
          # never goes Online, check that first (docs/oidc-build-lane.md).
          for i in $(seq 1 40); do
            ping=$(aws ssm describe-instance-information \
                    --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                    --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$ping" = "Online" ] && { echo "SSM online"; exit 0; }
            echo "  ssm ping=$ping ($i/40)"; sleep 15
          done
          echo "::error::SSM agent never came Online — cannot drive the build remotely."
          exit 1

      # Sync patches/ from THIS repo and re-apply them at the pinned tag. A patch conflict
      # fails here and the build never runs — the drift gate.
      - name: Rebase + apply patches (SSM RunCommand -> do_rebase.sh)
        if: ${{ github.event_name == 'workflow_call' || !inputs.lifecycle_only }}
        env:
          CHROMIUM_TAG_IN: ${{ inputs.chromium_tag }}
          # Default to the exact commit CI checked out, so the series the box applies is
          # provably the one in this run.
          PATCH_REF: ${{ inputs.patch_ref || github.sha }}
          JOB: ${{ inputs.job || 'android' }}
        run: |
          set -euo pipefail
          chmod +x scripts/aws/ssm-run.sh
          # Stage the script base64-encoded. The base64 wrapper is what makes the payload
          # metacharacter-free — the same reason the Windows lane uses it — but the Linux
          # side decodes with `base64 -d`, not [IO.File]::WriteAllBytes.
          # The patch SERIES is NOT staged here: it is megabytes, well past the RunCommand
          # payload limit, so the box pulls it from this repo at $PATCH_REF instead.
          reb=$(base64 -w0 scripts/aws/do_rebase.sh)
          printf '%s\n' \
            'set -e' \
            "install -d -o '${BUILD_USER}' -g '${BUILD_USER}' '${BUILD_DIR}'" \
            "printf '%s' '${reb}' | base64 -d > ${BUILD_DIR}/do_rebase.sh" \
            "chown '${BUILD_USER}' ${BUILD_DIR}/do_rebase.sh" \
            "chmod 0755 ${BUILD_DIR}/do_rebase.sh" \
            "sudo -u '${BUILD_USER}' env DXR_BUILD_ROOT='${BUILD_DIR}' DXR_JOB='${JOB}rebase' DXR_PATCH_REF='${PATCH_REF}' DXR_TARGET_TAG='${CHROMIUM_TAG_IN}' bash ${BUILD_DIR}/do_rebase.sh" \
          | scripts/aws/ssm-run.sh "$INSTANCE_ID" "android rebase ${GITHUB_RUN_ID} @ ${PATCH_REF}" 180

      # Build chrome_public_apk. do_build.sh wraps scripts/build.sh (DXR_TARGET_OS=android)
      # in the marker protocol and stages the APK at a predictable path.
      - name: Build chrome_public_apk (SSM RunCommand -> do_build.sh)
        if: ${{ github.event_name == 'workflow_call' || !inputs.lifecycle_only }}
        env:
          JOB: ${{ inputs.job || 'android' }}
          TIMEOUT_MIN: ${{ inputs.timeout_minutes || 300 }}
        run: |
          set -euo pipefail
          chmod +x scripts/aws/ssm-run.sh
          bld=$(base64 -w0 scripts/aws/do_build.sh)
          printf '%s\n' \
            'set -e' \
            "printf '%s' '${bld}' | base64 -d > ${BUILD_DIR}/do_build.sh" \
            "chown '${BUILD_USER}' ${BUILD_DIR}/do_build.sh" \
            "chmod 0755 ${BUILD_DIR}/do_build.sh" \
            "sudo -u '${BUILD_USER}' env DXR_BUILD_ROOT='${BUILD_DIR}' DXR_JOB='${JOB}' bash ${BUILD_DIR}/do_build.sh" \
          | scripts/aws/ssm-run.sh "$INSTANCE_ID" "android build ${GITHUB_RUN_ID}" "$TIMEOUT_MIN"

      # Re-assume BEFORE the upload: the job's initial credentials last at most the role's
      # MaxSessionDuration, and the build step alone is allowed 300 minutes, so on any long
      # build they are already dead by the time the build returns. The Windows lane lost a
      # successful 2h04m build to exactly this (ExpiredTokenException on SendCommand).
      - name: Re-assume AWS role before the artifact upload (build may have outlived them)
        if: ${{ github.event_name == 'workflow_call' || !inputs.lifecycle_only }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ANDROID_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-box-android-upload-${{ github.run_id }}
          role-duration-seconds: 7200

      # The box uploads to a RUN-SCOPED key with its OWN instance-profile credentials, and
      # we download that exact key. Do NOT base64 the APK back through RunCommand: the
      # output cap would truncate it silently (docs/oidc-build-lane.md).
      - name: Upload the APK from the box
        if: ${{ github.event_name == 'workflow_call' || !inputs.lifecycle_only }}
        env:
          JOB: ${{ inputs.job || 'android' }}
        run: |
          set -euo pipefail
          key="builds/${GITHUB_RUN_ID}/dxr_browser_${JOB}.apk"
          echo "ARTIFACT_KEY=$key" >> "$GITHUB_ENV"
          printf '%s\n' \
            'set -e' \
            "src=${BUILD_DIR}/${JOB}.apk" \
            'if [ ! -f "$src" ]; then echo "ERROR: no APK at $src"; exit 1; fi' \
            "aws s3 cp \"\$src\" s3://${ARTIFACT_BUCKET}/${key}" \
            'echo uploaded' \
          | scripts/aws/ssm-run.sh "$INSTANCE_ID" "android artifact upload ${GITHUB_RUN_ID}" 60

      - name: Fetch the artifact
        id: fetch
        if: ${{ github.event_name == 'workflow_call' || !inputs.lifecycle_only }}
        run: |
          set -euo pipefail
          key="$ARTIFACT_KEY"
          mkdir -p dist && aws s3 cp "s3://$ARTIFACT_BUCKET/$key" "dist/$(basename "$key")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          ls -la dist/
          # An APK is a zip; a truncated or HTML-error download is not. Catch it here
          # rather than at `adb install` time on someone's desk.
          unzip -l "dist/$(basename "$key")" >/dev/null || {
            echo "::error::the downloaded APK is not a readable zip — truncated upload?"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_call' || !inputs.lifecycle_only }}
        with:
          name: browser-android-apk
          path: dist/
          retention-days: 7

      # ── the load-bearing cleanup ────────────────────────────────────────────────────
      # Re-assume the role FIRST: `if: always()` does not save you if the credentials have
      # expired — the step runs, the API call is refused, and the instance is left RUNNING
      # and billing. That happened for real on the Windows lane and had to be cleaned up by
      # hand. A fresh assume immediately before the stop is correct for a run of any length.
      - name: Re-assume AWS role for cleanup (credentials may have expired)
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ANDROID_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-box-android-stop-${{ github.run_id }}
          role-duration-seconds: 7200

      # always(): a failed build, a cancelled run, or a timeout must still stop the box.
      # NEVER terminate — the multi-hour Chromium checkout lives on this instance's disk.
      - name: Stop the build box
        if: always()
        run: |
          set -uo pipefail
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null || true
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" || true
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
                    --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "$state"
          # Fail the step if the box did not actually stop, so a stranded (billing)
          # instance is loud rather than a green run with a quiet error line in it.
          case "$state" in
            stopped|stopping) ;;
            *) echo "::error::android build box is '$state', NOT stopped — it is still billing."
               echo "::error::Recover with: gh workflow run build-box-android.yml -f lifecycle_only=true"
               exit 1 ;;
          esac
