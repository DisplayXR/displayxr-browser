name: pipeline

# The security-maintenance pipeline (browser#38, the path to a maintained 1.0 on #33).
# Chains: rebase (#36) -> build (#45) -> weave-gate (#37) -> sign -> release -> feed,
# with ONE human confirmation: the `go-live` environment approval promotes a signed
# pre-release to the full-rollout feed. The clean path is a single Approve click; the two
# "needs a human" cases (rebase conflict, weave-gate HOLD) only appear when warranted.
#
# STATUS: the rebase + build + gate half is wired to the proven build-box lane. The
# publish half (sign on the Leia box, release, feed host) is present for review but gated
# behind `enable_publish` and UNVALIDATED end to end - see the handoff prompt in
# displayxr-runtime. Do NOT flip chromium-watch's DISPATCH_BUILD until a real dispatch has
# run clean through `go-live` at least once.

on:
  workflow_dispatch:
    inputs:
      chromium_tag:
        description: "Chromium stable tag to rebase onto + build (blank = rebuild current pin)"
        type: string
        default: ""
      rollout:
        description: "Staged-rollout % the feed lands at pre-approval (promote flips to 100)"
        type: number
        default: 10
      enable_publish:
        description: "Run sign/release/feed (browser#38, validated live)"
        type: boolean
        default: false
      version:
        description: "Marketing version to publish (e.g. 0.1.22). Required when enable_publish."
        type: string
        default: ""
      security:
        description: "This is a Chromium security rebase: feed gets security:true and an unsigned build HOLDS instead of shipping"
        type: boolean
        default: false
  workflow_call:
    inputs:
      chromium_tag:
        type: string
        default: ""
      rollout:
        type: number
        default: 10
      enable_publish:
        type: boolean
        default: false
      version:
        type: string
        default: ""
      security:
        type: boolean
        default: false

# The chain reaches the same single box (build, and the weave gate over SSM), so it takes
# the same lock. Sharing one group with build-box.yml would deadlock — the reusable
# workflow inherits the caller's group — so this guards the pipeline as a whole and
# build-box.yml guards direct dispatches of the build alone.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write   # release.sh creates a GitHub release
  id-token: write   # build-box assumes the AWS role via OIDC
  actions: read

jobs:
  # Rebase (#36) + build (#45), on the AWS box, credential-free via OIDC. Reuses the
  # proven lane; a patch conflict or build failure stops the pipeline here.
  build:
    uses: ./.github/workflows/build-box.yml
    with:
      chromium_tag: ${{ inputs.chromium_tag }}

  # Weave gate (#37): does the Chromium bump touch any file our patches modify? Empty
  # intersection -> auto-pass (weave bytes unchanged). Non-empty -> HOLD, and the approval
  # note tells the human to eyeball hardware before promoting. Runs on the box, which has
  # both the old (pin) and new checkout in git.
  gate:
    needs: build
    runs-on: ubuntu-latest
    environment: build-box
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gha-gate-${{ github.run_id }}
      - name: Run the weave gate on the box
        id: gate
        env:
          INSTANCE_ID: i-0150c4a09e3852120
          NEW_TAG: ${{ inputs.chromium_tag }}
        run: |
          set -euo pipefail
          # No tag = rebuild of the current pin = nothing rebased = weave unchanged.
          if [ -z "$NEW_TAG" ]; then echo "verdict=PASS (no rebase)" >> "$GITHUB_OUTPUT"; exit 0; fi
          chmod +x scripts/aws/ssm-run.sh
          OLD_TAG=$(sed -n 's/.*CHROMIUM_TAG="\${CHROMIUM_TAG:-\([0-9.]*\)}".*/\1/p' scripts/config.env | head -1)
          # weave-gate.sh exits 0 = auto-pass, 2 = HOLD, 3 = error(hold). Capture, don't
          # let a HOLD fail the job - it must reach the approver as a verdict, not a red X.
          set +e
          printf '%s\n' \
            '# bash is NOT on PATH under SSM RunCommand (SYSTEM context) — resolve it via git,' \
            '# which depot_tools guarantees. Latent until now only because the gate short-' \
            '# circuits to PASS when there is no rebase, so this line had never run.' \
            '$bash = if (Get-Command bash -ErrorAction SilentlyContinue) { "bash" } else {' \
            '  $g = (Get-Command git -ErrorAction SilentlyContinue)' \
            '  $root = if ($g) { Split-Path (Split-Path $g.Source -Parent) -Parent } else { "C:\Program Files\Git" }' \
            '  @("$root\bin\bash.exe","$root\usr\bin\bash.exe","C:\Program Files\Git\bin\bash.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1' \
            '}' \
            'if (-not $bash) { Write-Host "ERROR: no bash.exe found for the weave gate"; exit 3 }' \
            "cd C:\\cr\\src; & \$bash C:\\build\\weave-gate.sh --old '${OLD_TAG}' --new '${NEW_TAG}' --src C:\\cr\\src; exit \$LASTEXITCODE" \
          | scripts/aws/ssm-run.sh "$INSTANCE_ID" "browser#37 weave-gate ${GITHUB_RUN_ID}" 15
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "verdict=PASS" >> "$GITHUB_OUTPUT";
          else echo "verdict=HOLD (weave-bearing files changed - eyeball hardware before promote)" >> "$GITHUB_OUTPUT"; fi

  # --- publish half (browser#38, validated live) ------------------------------------
  #
  # sign + release run on windows-latest because scripts/sign.sh's remote path is
  # Windows-bound on purpose (powershell Compress/Expand-Archive, cygpath, and a REAL
  # Get-AuthenticodeSignature verify — pwsh-on-linux cannot check Authenticode at all).
  #
  # Signing auth: gh needs rights on the provider repo named by the DXR_SIGN_REPO repo
  # variable — the default token is repo-scoped, so without the CODESIGN_TOKEN secret
  # sign.sh takes its documented fail-open path and the run ships UNSIGNED with a
  # warning. `security: true` turns that fail-open into a HOLD: a security release must
  # never ship unsigned (handoff rule).

  sign:
    needs: [build, gate]
    if: ${{ inputs.enable_publish }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish without a version
        run: |
          [ -n "${{ inputs.version }}" ] || { echo "::error::enable_publish needs version="; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
          path: dist
      - name: Extract the staged tree
        run: |
          set -euo pipefail
          tar -xzf dist/dxr_browser_staged.tar.gz -C dist
          ls dist/DisplayXR-Browser/chrome.exe
      - name: Sign first-party binaries (provider via DXR_SIGN_REPO)
        env:
          DXR_SIGN_REPO: ${{ vars.DXR_SIGN_REPO }}
          GH_TOKEN: ${{ secrets.CODESIGN_TOKEN || github.token }}
        run: |
          set -euo pipefail
          bash scripts/sign.sh dist/DisplayXR-Browser 2>&1 | tee sign-inner.log
          if grep -q "UNSIGNED" sign-inner.log; then
            if [ "${{ inputs.security }}" = "true" ]; then
              echo "::error::security release but the inner binaries are UNSIGNED — holding (add the CODESIGN_TOKEN secret)"
              exit 1
            fi
            echo "::warning::inner binaries UNSIGNED (no CODESIGN_TOKEN / provider unreachable) — allowed for a non-security preview"
          fi
      - name: Build the installer (NSIS)
        run: |
          set -euo pipefail
          command -v makensis >/dev/null || choco install nsis -y
          W=$(cygpath -w "$PWD/dist"); S=$(cygpath -w "$PWD/dist/DisplayXR-Browser")
          makensis -DVERSION=${{ inputs.version }} -DSTAGE_DIR="$S" -DSOURCE_DIR="$S" -DOUTPUT_DIR="$W" installer/DisplayXRBrowserInstaller.nsi
          ls dist/DisplayXR-Browser-Preview-Setup-${{ inputs.version }}.exe
      - name: Sign the installer
        env:
          DXR_SIGN_REPO: ${{ vars.DXR_SIGN_REPO }}
          GH_TOKEN: ${{ secrets.CODESIGN_TOKEN || github.token }}
        run: |
          set -euo pipefail
          bash scripts/sign.sh dist 2>&1 | tee sign-outer.log
          if grep -q "UNSIGNED" sign-outer.log && [ "${{ inputs.security }}" = "true" ]; then
            echo "::error::security release but the installer is UNSIGNED — holding"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: browser-installer
          path: dist/DisplayXR-Browser-Preview-Setup-${{ inputs.version }}.exe
          if-no-files-found: error

  # Publish as a STAGED PRE-release + feed at the input rollout. The org pin does NOT
  # move here — versions.json means "tested together and live", which a staged
  # pre-release is not yet. Everything user-visible flips in `promote`.
  release:
    needs: sign
    runs-on: windows-latest
    if: ${{ inputs.enable_publish }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-installer
          path: dist
      - name: Publish pre-release + staged feed
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLOUT: ${{ inputs.rollout }}
          SECURITY: ${{ inputs.security }}
        run: |
          set -euo pipefail
          STAGED=1 bash scripts/release.sh "preview-${{ inputs.version }}" \
            "dist/DisplayXR-Browser-Preview-Setup-${{ inputs.version }}.exe"
      - name: Commit the staged feed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # checkout leaves a detached HEAD on a dispatch — name the ref explicitly.
          git config user.name "displayxr-pipeline"
          git config user.email "dev@displayxr.invalid"
          git add feed/feed.json
          git commit -m "feed: ${{ inputs.version }} (staged, rollout ${{ inputs.rollout }})"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

  # THE ONE CLICK. `go-live` is a protected environment (required reviewer = maintainer).
  # Approving promotes the staged pre-release to a full latest release, flips the feed to
  # rollout 100, and moves the org pin. The weave-gate verdict is printed so the approver
  # sees PASS vs HOLD before clicking. (Until browser#40's updater ships, `rollout` has no
  # consumer — the start-page check offers the newest feed entry to everyone — so promote
  # is what makes the release REAL for users either way: it is what moves `latest`.)
  promote:
    needs: [gate, release]
    if: ${{ inputs.enable_publish }}
    runs-on: ubuntu-latest
    environment: go-live
    steps:
      - uses: actions/checkout@v4
      - name: Promote to full release + rollout 100
        env:
          GH_TOKEN: ${{ github.token }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "weave-gate verdict: ${{ needs.gate.outputs.verdict }}"
          git pull --rebase origin "$BRANCH" || true
          bash scripts/promote-release.sh "preview-${{ inputs.version }}"
          git config user.name "displayxr-pipeline"
          git config user.email "dev@displayxr.invalid"
          git add feed/feed.json
          git commit -m "feed: ${{ inputs.version }} promoted (rollout 100)"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
